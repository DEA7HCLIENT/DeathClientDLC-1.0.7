name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No gradlew in the repo, so install Gradle through the action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle build --no-daemon

      # Runs only when Build failed: prints the real RenderLayer / VertexConsumer method names.
      - name: Dump RenderLayer API
        if: failure()
        run: |
          for j in $(find ~/.gradle/caches/fabric-loom -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" | grep -q "net/minecraft/client/render/RenderLayer.class"; then
              echo "=== JAR: $j"
              javap -cp "$j" net.minecraft.client.render.RenderLayer | grep -i "static.*RenderLayer get"
              javap -cp "$j" net.minecraft.client.render.VertexConsumer | grep -i "vertex\|color"
              break
            fi
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
