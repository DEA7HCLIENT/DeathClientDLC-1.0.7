name: Fabric Mod Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \( \
            -iname "*.zip" -o \
            -iname "*.zip.bak" \
          \) -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No source ZIP found"
            exit 1
          fi

          mkdir -p source
          unzip -o "$ZIP" -d source

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=$(find source -name gradlew -type f \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "No Gradle wrapper found."
            echo "The ZIP must contain a Fabric Gradle project."
            find source -maxdepth 4 -type f
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build Fabric JAR
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Collect JAR files
        shell: bash
        run: |
          mkdir -p output

          find source -path "*/build/libs/*.jar" \
            ! -name "*-dev.jar" \
            ! -name "*-sources.jar" \
            -exec cp {} output/ \;

          if [ -z "$(find output -name '*.jar' -print -quit)" ]; then
            echo "No JAR generated!"
            exit 1
          fi

          ls -lh output/

      - name: Upload Fabric Mod
        uses: actions/upload-artifact@v4
        with:
          name: Fabric-Mod-JAR
          path: output/*.jar
          if-no-files-found: error
          retention-days: 14
