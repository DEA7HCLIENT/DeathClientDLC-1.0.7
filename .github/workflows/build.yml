name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # No gradlew in the repo, so install Gradle through the action.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unzip project
        run: |
          ZIP=$(find . -name "*.zip" -not -path "./.git/*" | head -n 1)
          echo "ZIP=$ZIP"
          mkdir -p src_unzipped
          unzip -q "$ZIP" -d src_unzipped

      - name: Build
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          echo "Project dir: $(dirname "$FILE")"
          cd "$(dirname "$FILE")"
          gradle build --no-daemon

      # Runs only when Build failed: prints the real RenderLayer / VertexConsumer method names.
      - name: Dump RenderLayer API
        if: failure()
        run: |
          for j in $(find /home/runner/.gradle/caches/fabric-loom -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" | grep -q "net/minecraft/client/render/RenderLayer.class"; then
              echo "=== JAR: $j"
              javap -cp "$j" net.minecraft.client.render.RenderLayer > /tmp/rl.txt || true
              javap -cp "$j" net.minecraft.client.render.VertexConsumer > /tmp/vc.txt || true
              echo "--- RenderLayer:"
              grep -i "RenderLayer get" /tmp/rl.txt || true
              echo "--- VertexConsumer:"
              grep -i "vertex\|color" /tmp/vc.txt || true
              break
            fi
          done

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC
          path: |
            src_unzipped/**/build/libs/*.jar
            !src_unzipped/**/build/libs/*-sources.jar
            !src_unzipped/**/build/libs/*-dev.jar
