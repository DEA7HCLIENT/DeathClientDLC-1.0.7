name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project root
        id: root
        run: |
          FILE=$(find . -name build.gradle -not -path '*/build/*' -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::build.gradle не найден ни в одной папке репозитория. Загрузите файлы проекта."
            echo "Список файлов в репозитории:"
            find . -path ./.git -prune -o -print | head -n 100
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Нашёл проект в: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build
        working-directory: ${{ steps.root.outputs.dir }}
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC
          path: ${{ steps.root.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
