name: Build Project

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Find ZIP archive
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP archive not found!"
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip_path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o "${{ steps.find_zip.outputs.zip_path }}" -d extracted

      - name: Show extracted files
        run: |
          echo "Extracted project:"
          find extracted -maxdepth 4 -type f

      - name: Build project
        run: |
          if [ -f extracted/package.json ]; then
            cd extracted
            npm install
            npm run build
          elif [ -f extracted/Makefile ]; then
            cd extracted
            make
          else
            echo "No recognized build configuration found."
            echo "ZIP extraction completed successfully."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            extracted/
            !extracted/node_modules/
          if-no-files-found: error
          retention-days: 7
