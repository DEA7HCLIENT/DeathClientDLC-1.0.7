name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Unpack project
        run: unzip -qo DeathClientDLC_43.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build with Gradle
        working-directory: DeathClientDLC
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC
          path: DeathClientDLC/build/libs/*.jar
          if-no-files-found: error
