name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          z=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          echo "zip: $z"
          unzip -oq "$z" -d unpacked
          p=$(find unpacked -name gradle.properties | head -n1)
          sed -i 's/^loom_version=.*/loom_version=1.14-SNAPSHOT/; s/^fabric_api_version=.*/fabric_api_version=0.141.1+1.21.11/' "$p"

      - name: Find project dir
        id: find
        run: |
          f=$(find unpacked -name settings.gradle | head -n1)
          test -n "$f" || (ls -R | head -50; exit 1)
          echo "dir=$(dirname $f)" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DeathClientDLC
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
